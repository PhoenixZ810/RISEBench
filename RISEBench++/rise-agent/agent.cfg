[agent]
# API keys are intentionally not stored here. Set them in run_agent.sh.

# Model names
planner_model = gpt-5.1
verifier_model = gemini-3-flash-preview
# Replace with your own url
api_base = https://api.xxxxxx.ai/v1

# FLUX.2-klein-9B
# Replace with your own path
model_path = /data/models/FLUX.2-klein-9B
steps = 4
guidance_scale = 1.0
cpu_offload = false

# Dataset and output paths. Relative paths are resolved from this cfg directory.
data = ../data/overall_data.json
input_dir = ../data
output_dir = ../outputs/rise-agent

# Agent loop settings. A multi-turn sample runs as a chain of independent single-turn loops.
seed = 42
max_replans = 1
max_refinements = 2

# Optional subset. Leave blank to run all samples.
category =
indices =
start = 0
limit =

# Runtime behavior
overwrite = false
fail_fast = false
dry_run = false
